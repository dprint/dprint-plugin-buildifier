# GENERATED BY ./ci.ts -- DO NOT DIRECTLY EDIT

name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '*'
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: deno run -A ./scripts/build.ts --docker
      - name: Test Wasm
        run: deno run -A ./scripts/test_wasm.ts
      - name: Lint workflow generation
        run: |-
          ./.github/workflows/ci.ts --lint
          ./.github/workflows/publish_npm.ts --lint
          ./.github/workflows/release.ts --lint
          ./.github/workflows/check_updates.ts --lint
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
      - name: Setup and test npm deployment
        run: |-
          cd deployment/npm
          npm install
          node setup.js
          npm run test
      - name: Get tag version
        id: get_tag_version
        if: 'startsWith(github.ref, ''refs/tags/'')'
        run: 'echo "TAG_VERSION=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"'
      - name: Pre-release
        if: 'startsWith(github.ref, ''refs/tags/'')'
        run: |-
          test "$(cat VERSION)" = "${{ steps.get_tag_version.outputs.TAG_VERSION }}" || (echo "The VERSION file doesn't match the tag" && exit 1)
          # update config schema to have version
          sed -i 's/dprint-plugin-buildifier\/0.0.0/dprint-plugin-buildifier\/${{ steps.get_tag_version.outputs.TAG_VERSION }}/' deployment/schema.json
          # create release notes
          deno run -A ./scripts/generateReleaseNotes.ts ${{ steps.get_tag_version.outputs.TAG_VERSION }} > ${{ github.workspace }}-CHANGELOG.txt
      - name: Release
        if: 'startsWith(github.ref, ''refs/tags/'')'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |-
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file ${{ github.workspace }}-CHANGELOG.txt \
            target/plugin.wasm \
            deployment/schema.json
